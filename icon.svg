<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#grad2)" />
  <circle cx="256" cy="256" r="210" fill="#0f0f15" opacity="0.9" />
  
  <!-- Outer glowing rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#grad1)" stroke-width="6" opacity="0.4" stroke-dasharray="10 15" />
  
  <!-- Main Logo Icon (Graduation Cap + Calendar elements) -->
  <g filter="url(#shadow)" transform="translate(128, 128)">
    <!-- Graduation Cap Top (Diamond) -->
    <polygon points="128,40 230,90 128,140 26,90" fill="url(#grad1)" />
    
    <!-- Cap Base -->
    <path d="M60,110 L60,150 C60,180 196,180 196,150 L196,110 C196,110 128,140 60,110 Z" fill="url(#grad2)" />
    
    <!-- Tassel -->
    <path d="M128,90 L200,120 L200,165" fill="none" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="200" cy="170" r="10" fill="#fbbf24" />
    
    <!-- Calendar Page lines in background or base -->
    <rect x="98" y="145" width="60" height="40" rx="6" fill="#0f0f15" stroke="url(#grad1)" stroke-width="4" />
    <line x1="110" y1="155" x2="146" y2="155" stroke="#ec4899" stroke-width="3" stroke-linecap="round" />
    <line x1="110" y1="165" x2="136" y2="165" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" />
    <line x1="110" y1="175" x2="126" y2="175" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>
