AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Study-Smart Vision Serverless Backend (OpenCV AI Competition 2026)

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]

Resources:
  # Temporary S3 Bucket for image uploads before extraction
  # Privacy-first: Auto-delete objects after 1 day
  StudySmartVisionBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'studysmart-vision-upload-\-\-\'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: AutoDeleteTempImages
            Status: Enabled
            ExpirationInDays: 1

  # Agentic Vision Processing Lambda
  VisionAgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: agent_handler.lambda_handler
      Runtime: python3.11
      Timeout: 30
      MemorySize: 1024
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref StudySmartVisionBucket
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: "*"
      Environment:
        Variables:
          S3_BUCKET: !Ref StudySmartVisionBucket
          ENVIRONMENT: !Ref Environment
          LOG_LEVEL: INFO
      Events:
        ExtractApi:
          Type: Api
          Properties:
            Path: /extract
            Method: post

  # API Gateway Logs for Observability
  ApiGatewayApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Environment
      TracingEnabled: true
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          LoggingLevel: INFO
          MetricsEnabled: true

Outputs:
  VisionApiUrl:
    Description: "API Gateway endpoint URL for Study-Smart Vision"
    Value: !Sub "https://\.execute-api.\.amazonaws.com/\/extract"
